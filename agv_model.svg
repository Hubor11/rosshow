<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#424242"/>
      <stop offset="100%" style="stop-color:#212121"/>
    </linearGradient>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDD835"/>
      <stop offset="100%" style="stop-color:#F9A825"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#FAFAFA"/>

  <!-- Main Chassis Body -->
  <rect x="100" y="450" width="1400" height="250" rx="10" fill="url(#blueGradient)" stroke="#1565C0" stroke-width="3"/>

  <!-- Front Bumper -->
  <rect x="50" y="620" width="300" height="60" rx="5" fill="url(#yellowGradient)" stroke="#F57F17" stroke-width="2"/>
  
  <!-- Bumper Stripes -->
  <g>
    <rect x="60" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
    <rect x="100" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
    <rect x="140" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
    <rect x="180" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
    <rect x="220" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
    <rect x="260" y="630" width="35" height="40" fill="#212121" transform="skewX(-10)"/>
  </g>

  <!-- Front Panel -->
  <rect x="120" y="470" width="260" height="120" rx="8" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  
  <!-- Front Lights -->
  <circle cx="150" cy="510" r="12" fill="#F44336"/>
  <circle cx="150" cy="550" r="12" fill="#FFEB3B"/>
  <circle cx="350" cy="510" r="12" fill="#F44336"/>
  <circle cx="350" cy="550" r="12" fill="#FFEB3B"/>

  <!-- Headlights -->
  <circle cx="150" cy="600" r="15" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
  <circle cx="350" cy="600" r="15" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>

  <!-- First Container -->
  <rect x="200" y="100" width="550" height="350" fill="url(#redGradient)" stroke="#B71C1C" stroke-width="3"/>
  
  <!-- Container Corrugations -->
  <g>
    <rect x="220" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="245" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="270" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="295" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="320" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="345" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="370" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="395" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="420" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="445" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="470" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="495" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="520" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="545" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="570" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="595" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="620" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="645" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="670" y="100" width="15" height="350" fill="#C62828"/>
    <rect x="695" y="100" width="15" height="350" fill="#EF5350"/>
    <rect x="720" y="100" width="15" height="350" fill="#C62828"/>
  </g>

  <!-- Container Doors -->
  <rect x="200" y="120" width="180" height="300" fill="#AD1457" stroke="#880E4F" stroke-width="2"/>
  <rect x="380" y="120" width="180" height="300" fill="#AD1457" stroke="#880E4F" stroke-width="2"/>

  <!-- Container Door Latches -->
  <circle cx="250" cy="200" r="10" fill="#BDBDBD"/>
  <circle cx="310" cy="200" r="10" fill="#BDBDBD"/>
  <circle cx="430" cy="200" r="10" fill="#BDBDBD"/>
  <circle cx="490" cy="200" r="10" fill="#BDBDBD"/>

  <!-- Triangle Warning -->
  <polygon points="280,300 310,350 250,350" fill="#FF6F00" stroke="#E65100" stroke-width="2"/>

  <!-- Second Container -->
  <rect x="800" y="130" width="550" height="320" fill="url(#redGradient)" stroke="#B71C1C" stroke-width="3"/>
  
  <!-- Second Container Corrugations -->
  <g>
    <rect x="820" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="845" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="870" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="895" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="920" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="945" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="970" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="995" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1020" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1045" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1070" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1095" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1120" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1145" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1170" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1195" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1220" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1245" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1270" y="130" width="15" height="320" fill="#C62828"/>
    <rect x="1295" y="130" width="15" height="320" fill="#EF5350"/>
    <rect x="1320" y="130" width="15" height="320" fill="#C62828"/>
  </g>

  <!-- Second Container Door -->
  <rect x="800" y="150" width="160" height="270" fill="#AD1457" stroke="#880E4F" stroke-width="2"/>

  <!-- Yellow Supports -->
  <g fill="url(#yellowGradient)" stroke="#F57F17" stroke-width="2">
    <rect x="220" y="400" width="60" height="50"/>
    <rect x="320" y="400" width="60" height="50"/>
    <rect x="450" y="400" width="60" height="50"/>
    <rect x="580" y="400" width="60" height="50"/>
    <rect x="850" y="400" width="60" height="50"/>
    <rect x="980" y="400" width="60" height="50"/>
    <rect x="1100" y="400" width="60" height="50"/>
    <rect x="1230" y="400" width="60" height="50"/>
  </g>

  <!-- Wheels -->
  <g>
    <!-- First Wheel Set -->
    <circle cx="550" cy="720" r="90" fill="url(#wheelGradient)" stroke="#000000" stroke-width="3"/>
    <circle cx="550" cy="720" r="45" fill="#303030" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="550" cy="720" r="15" fill="#1A1A1A"/>
    
    <!-- Second Wheel Set -->
    <circle cx="700" cy="720" r="90" fill="url(#wheelGradient)" stroke="#000000" stroke-width="3"/>
    <circle cx="700" cy="720" r="45" fill="#303030" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="700" cy="720" r="15" fill="#1A1A1A"/>
    
    <!-- Third Wheel Set -->
    <circle cx="1150" cy="720" r="90" fill="url(#wheelGradient)" stroke="#000000" stroke-width="3"/>
    <circle cx="1150" cy="720" r="45" fill="#303030" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="1150" cy="720" r="15" fill="#1A1A1A"/>
    
    <!-- Fourth Wheel Set -->
    <circle cx="1300" cy="720" r="90" fill="url(#wheelGradient)" stroke="#000000" stroke-width="3"/>
    <circle cx="1300" cy="720" r="45" fill="#303030" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="1300" cy="720" r="15" fill="#1A1A1A"/>
  </g>

  <!-- Side Panels -->
  <g fill="#1565C0" stroke="#0D47A1" stroke-width="2">
    <rect x="780" y="480" width="280" height="150"/>
    <rect x="1080" y="480" width="280" height="150"/>
  </g>

  <!-- Warning Labels -->
  <g>
    <rect x="840" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
    <rect x="900" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
    <rect x="960" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
    <rect x="1140" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
    <rect x="1200" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
    <rect x="1260" y="510" width="40" height="40" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
  </g>

  <!-- Ventilation Grilles -->
  <g fill="#424242">
    <rect x="400" y="520" width="100" height="20" rx="3"/>
    <rect x="400" y="550" width="100" height="20" rx="3"/>
    <rect x="400" y="580" width="100" height="20" rx="3"/>
    <rect x="400" y="610" width="100" height="20" rx="3"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="800" cy="800" rx="650" ry="40" fill="#000000" opacity="0.3"/>

</svg>
